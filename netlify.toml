[build]
  command = "npm run build"
  publish = "dist"

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    # CSP en modo Report-Only: no bloquea nada, solo reporta en la consola del navegador.
    # Una CSP estricta es riesgosa aquí (scripts/estilos en línea de Astro y Leaflet, anuncios futuros, Supabase
    # Storage). Revisa la consola, ajusta las fuentes y cambia a "Content-Security-Policy" cuando esté limpia.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Las redirecciones con conteo nunca se guardan en caché ni se indexan
[[headers]]
  for = "/ir/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
