<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b34"/>
      <stop offset="0.55" stop-color="#0e8571"/>
      <stop offset="1" stop-color="#14a38b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <circle cx="1080" cy="80" r="260" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="1140" cy="600" r="180" fill="#ffffff" fill-opacity="0.06"/>
  <!-- Isotipo: pin de ubicación (mismo dibujo que public/favicon.svg) -->
  <g transform="translate(90 165) scale(9)">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="#ffffff"/>
    <path d="M16 5.5c-4.7 0-8 3.4-8 7.6 0 5.2 8 13.4 8 13.4s8-8.2 8-13.4c0-4.2-3.3-7.6-8-7.6z" fill="#0e8571"/>
