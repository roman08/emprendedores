# PLANTILLA: este archivo vive en docs/ porque el token de Git de esta máquina no tiene el permiso "workflow".
# Para activarlo: en GitHub -> Add file -> Create new file, nómbralo ".github/workflows/keepalive.yml",
# pega este contenido y confirma (desde la web no hace falta ningún token).
#
# Evita que el plan gratuito de Supabase pause el proyecto por inactividad (tras ~7 días sin uso).
# Visita periódicamente una página pública que consulta la base de datos; no necesita claves ni secretos.
# Si cambias la dirección del sitio, define la variable SITE_URL del repositorio
# (GitHub -> Settings -> Secrets and variables -> Actions -> Variables) o edita el valor por defecto de abajo.
name: Mantener activo

on:
  schedule:
    - cron: '17 14 */3 * *'   # cada 3 días, 14:17 UTC
  workflow_dispatch: {}        # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar páginas que consultan la base de datos
        env:
          SITE: ${{ vars.SITE_URL || 'https://porlaesquina.netlify.app' }}
        run: |
          for path in / /explorar /cerca; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$SITE$path")
            echo "$SITE$path -> HTTP $code"
            if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then exit 1; fi
          done
